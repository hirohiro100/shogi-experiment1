<script>
	let ex1Data = {
	no: "例1",
	displayNo: "例1",
	image: "images1/例1.png",
	komadoku: "先手角1歩・後手金交換",
	sashite: "▲１八角打 手番△後手",
	aiJudgment: "互角",
	aiMoves: [{move:"△３九銀打", eval:"-251"}, {move:"△８七歩成", eval:"-11"}, {move:"△３六歩打", eval:"33"}, {move:"△３四金打", eval:"85"}, {move:"△５四銀", eval:"120"}]
	};

	let practiceQuestions = [
	{
	no: "例2",
	displayNo: "例2",
	image: "images1/例2.png",
	komadoku: "駒どくなし",
	sashite: "▲２二歩打 手番△後手",
	aiJudgment: "互角",
	aiMoves: [{move:"△同金", eval:"-258"}, {move:"△８八歩打", eval:"-103"}, {move:"△３七歩打", eval:"-61"}, {move:"△８六歩打", eval:"125"}, {move:"△８四飛", eval:"125"}]
	},
	{
	no: "例3",
	displayNo: "例3",
	image: "images1/例3.png",
	komadoku: "先手銀・後手金桂1歩交換",
	sashite: "△５一金 手番▲先手",
	aiJudgment: "後手有利",
	aiMoves: [{move:"▲４四銀成", eval:"-694"}, {move:"▲４四銀", eval:"-694"}, {move:"▲４六歩", eval:"-985"}, {move:"▲８二歩打", eval:"-994"}, {move:"▲１五歩", eval:"-994"}]
	}
	];

	let questions = [];

	let currentPracticeIndex = 0;
	let currentIndex = 0;
	let questionStartTime = 0;
	let subjectId = "";
	let appRanksData = {};
	let thresholdData = {};
	const practiceResults = [];
	const results = [];

	window.addEventListener('DOMContentLoaded', () => {
	loadCsvFileDirectly();
	});

	function setupBoardOrientation(noStr, wrapperElem, senteElem, goteElem) {
	if (noStr && noStr.includes("逆")) {
	senteElem.innerText = "△ 後手";
	goteElem.innerText = "▲ 先手";
	} else {
	senteElem.innerText = "▲ 先手";
	goteElem.innerText = "△ 後手";
	}
	}

	function cleanKomadoku(str) {
	if (!str) return "駒どくなし";
	return str.replace(/^[0-9０-９]+[\.\s\-述]*\s*/, "").trim() || "駒どくなし";
	}

	function parseCSV(text) {
	let lines = text.split(/\r\n|\n/);
	let result = [];
	for (let i = 0; i < lines.length; i++) {
	let line = lines[i].trim();
	if (!line) continue;
	let row = [];
	let inQuotes = false;
	let entry = '';
	for (let c = 0; c < line.length; c++) {
	let char = line[c];
	if (char === '"') {
	inQuotes = !inQuotes;
	} else if (char === ',' && !inQuotes) {
	row.push(entry.trim());
	entry = '';
	} else {
	entry += char;
	}
	}
	row.push(entry.trim());
	result.push(row);
	}
	return result;
	}

	async function loadCsvFileDirectly() {
	try {
	const response = await fetch('images1/駒得、評価値1.csv');
	if (!response.ok) throw new Error("CSVファイルが見つかりません");
	const csvText = await response.text();

	const rows = parseCSV(csvText);

	let mainList = [];
	let loadedPractices = [];
	let ex1Obj = null;
	let questionCounter = 1;

	for (let i = 0; i < rows.length; i++) {
	const r = rows[i];
	if (!r || r.length === 0) continue;

	let colA = String(r[0] || "").trim();
	let colC = String(r[2] || "").trim();
	let colD = String(r[3] || "").trim();
	let colE = String(r[4] || "").trim();
	let colF = String(r[5] || "").trim();
	let colG = String(r[6] || "").trim();

	if (!colA || colA === "表示番号") continue;

	let moves = [];
	if (colF) {
	moves.push({ move: colF, eval: colG });
	}
	for (let col = 7; col < r.length; col += 2) {
	let moveText = String(r[col] || "").trim();
	let evalText = String(r[col + 1] || "").trim();
	if (moveText) {
	moves.push({ move: moveText, eval: evalText });
	}
	}

	let cleanedKoma = cleanKomadoku(colC);

	if (colA === "例1") {
	ex1Obj = {
	no: colA,
	displayNo: "例1",
	image: `images1/${colA}.png`,
	komadoku: cleanedKoma,
	sashite: colD,
	aiJudgment: colE || "互角",
	aiMoves: moves
	};
	} else if (colA === "例2") {
	loadedPractices[0] = {
	no: colA,
	displayNo: "例2",
	image: `images1/${colA}.png`,
	komadoku: cleanedKoma,
	sashite: colD,
	aiJudgment: colE || "互角",
	aiMoves: moves
	};
	} else if (colA === "例3") {
	loadedPractices[1] = {
	no: colA,
	displayNo: "例3",
	image: `images1/${colA}.png`,
	komadoku: cleanedKoma,
	sashite: colD,
	aiJudgment: colE || "互角",
	aiMoves: moves
	};
	} else if (!colA.startsWith("例")) {
	mainList.push({
	no: colA,
	displayNo: `問${questionCounter}`,
	image: `images1/${colA}.png`,
	komadoku: cleanedKoma,
	sashite: colD,
	aiJudgment: colE || "互角",
	aiMoves: moves
	});
	questionCounter++;
	}
	}

	if (ex1Obj) {
	ex1Data = ex1Obj;
	setupBoardOrientation(ex1Data.no, document.getElementById("intro-board-wrapper"), document.getElementById("intro-sente"), document.getElementById("intro-gote"));
	}
	const introImg = document.getElementById("intro-board-image");
	if (introImg) {
	introImg.src = ex1Data.image;
	document.getElementById("practice-intro-komadoku").innerText = "【駒関係】 " + ex1Data.komadoku;
	document.getElementById("practice-intro-sashite").innerText = "【指し手・手番】 " + ex1Data.sashite;
	}

	if (loadedPractices[0] || loadedPractices[1]) {
	practiceQuestions = [
	loadedPractices[0] || practiceQuestions[0],
	loadedPractices[1] || practiceQuestions[1]
	];
	}

	if (mainList.length > 0) {
	questions = mainList;
	document.getElementById("loading-status").style.display = "none";
	const nextBtn = document.getElementById("intro-next-btn");
	nextBtn.disabled = false;
	nextBtn.innerText = "次へ進む";
	} else {
	document.getElementById("loading-status").innerText = "⚠️ CSVに有効な本番データが見つかりませんでした。";
	}

	} catch (err) {
	console.error("CSVファイルの読み込みエラー:", err);
	document.getElementById("loading-status").innerText = "⚠️ CSVの読み込みに失敗しました（ファイル名や配置場所をご確認ください）";
	}
	}

	function handleImageError(imgElem) {
	const currentSrc = imgElem.src;
	if (currentSrc.endsWith('.png')) {
	imgElem.src = currentSrc.replace('.png', '.jpg');
	} else if (currentSrc.endsWith('.jpg')) {
	imgElem.onerror = null;
	}
	}

	function goToSection(sectionId) {
	document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
	document.getElementById(sectionId).classList.add('active');
	}

	function toggleOtherAppInput() {
	const otherCb = document.getElementById("app-other-checkbox");
	const otherBox = document.getElementById("other-app-name-box");
	if (otherCb.checked) {
	otherBox.style.display = "block";
	} else {
	otherBox.style.display = "none";
	document.getElementById("other-app-name").value = "";
	}
	}

	function updateRankInputs() {
	const checkboxes = document.querySelectorAll('input[name="app-checkbox"]:checked');
	const rankContainer = document.getElementById("rank-container");
	const rankInputsArea = document.getElementById("rank-inputs-area");

	rankInputsArea.innerHTML = "";

	if (checkboxes.length > 0) {
	rankContainer.style.display = "block";
	checkboxes.forEach(cb => {
	let appName = cb.value;
	if (appName === "その他") {
	const customName = document.getElementById("other-app-name").value.trim();
	appName = customName !== "" ? customName : "その他";
	}

	const div = document.createElement("div");
	div.className = "dynamic-rank-box";
	div.innerHTML = `
	<label><strong>【${appName}】の最高段位（または級位）:</strong></label>
	<input type="text" class="rank-input" data-app="${appName}" placeholder="例: 4段、初段、3級 など">
	`;
	rankInputsArea.appendChild(div);
	});
	} else {
	rankContainer.style.display = "none";
	}
	}

	function goToSetupNext() {
	const idInput = document.getElementById("subject-id").value.trim();
	if (!idInput) {
	alert("お名前識別コードをご入力ください。");
	return;
	}
	subjectId = idInput;

	const checkboxes = document.querySelectorAll('input[name="app-checkbox"]:checked');
	if (checkboxes.length === 0) {
	alert("普段よく使う将棋アプリを少なくとも1つ選択してください。");
	return;
	}

	const otherCb = document.getElementById("app-other-checkbox");
	if (otherCb.checked && !document.getElementById("other-app-name").value.trim()) {
	alert("「その他」の具体的なアプリ名をご入力ください。");
	return;
	}

	appRanksData = {};
	let hasEmptyRank = false;
	const rankInputs = document.querySelectorAll('.rank-input');

	rankInputs.forEach(input => {
	const val = input.value.trim();
	if (!val) {
	hasEmptyRank = true;
	}
	const appName = input.getAttribute("data-app");
	appRanksData[appName] = val;
	});

	if (hasEmptyRank) {
	alert("選択したすべてのアプリの最高段位（または級位）をご入力ください。");
	return;
	}

	goToSection('threshold-section');
	}

	function goToPracticeIntro() {
	const yuri = document.getElementById("thresh-yuri").value.trim();
	const yusei = document.getElementById("thresh-yusei").value.trim();
	const katsusei = document.getElementById("thresh-katsusei").value.trim();

	if (!yuri || !yusei || !katsusei) {
	alert("①有利、②優勢、③勝勢 のすべての項目をご入力ください。");
	return;
	}

	thresholdData = {
	yuri: yuri,
	yusei: yusei,
	katsusei: katsusei
	};

	setupBoardOrientation("例1", document.getElementById("ref-board-wrapper"), document.getElementById("ref-sente"), document.getElementById("ref-gote"));
	setupBoardOrientation(ex1Data.no, document.getElementById("intro-board-wrapper"), document.getElementById("intro-sente"), document.getElementById("intro-gote"));
	goToSection('practice-intro-section');
	}

	function startPractice() {
	currentPracticeIndex = 0;
	goToSection('practice-section');
	showPracticeQuestion();
	}

	function showPracticeQuestion() {
	const q = practiceQuestions[currentPracticeIndex];
	document.getElementById("practice-question-number").innerText = `例題 ${currentPracticeIndex + 1} / ${practiceQuestions.length}`;

	setupBoardOrientation(q.no, document.getElementById("practice-board-wrapper"), document.getElementById("practice-sente"), document.getElementById("practice-gote"));

	const imgElem = document.getElementById("practice-board-image");
	imgElem.src = q.image;

	document.getElementById("practice-komadoku").innerText = "【駒関係】 " + q.komadoku;
	document.getElementById("practice-sashite").innerText = "【指し手・手番】 " + (q.sashite || "なし");

	document.querySelectorAll('input[name="practice-ans"]').forEach(radio => radio.checked = false);
	document.getElementById("practice-next-btn").disabled = true;
	}

	function enableNextButton(type) {
	if (type === 'practice') {
	document.getElementById("practice-next-btn").disabled = false;
	} else if (type === 'exp') {
	document.getElementById("exp-next-btn").disabled = false;
	}
	}

	function nextPractice() {
	const selectedRadio = document.querySelector('input[name="practice-ans"]:checked');
	if (!selectedRadio) return;

	practiceResults.push({
	questionNo: practiceQuestions[currentPracticeIndex].displayNo,
	userAnswer: selectedRadio.value
	});

	currentPracticeIndex++;
	if (currentPracticeIndex < practiceQuestions.length) {
	showPracticeQuestion();
	} else {
	showPracticeResults();
	}
	}

	function showPracticeResults() {
	goToSection('practice-result-section');
	const container = document.getElementById("practice-feedback-container");
	container.innerHTML = "";

	practiceQuestions.forEach((q, idx) => {
	const userAns = practiceResults[idx] ? practiceResults[idx].userAnswer : "未回答";

	let movesHtml = "";
	q.aiMoves.forEach((m, mIdx) => {
	movesHtml += `
	<div class="ai-move-item">
	<span><strong>${mIdx + 1}.</strong> ${m.move}</span>
	<span style="color: #666;">(${m.eval})</span>
	</div>
	`;
	});

	const card = document.createElement("div");
	card.className = "result-card";
	card.innerHTML = `
	<div class="result-img-box" onclick="openModal('${q.image}')">
	<div style="font-size:12px; font-weight:bold; margin-bottom:4px;">例題 ${idx + 1} (タップで拡大)</div>
	<img src="${q.image}" alt="局面図" onerror="handleImageError(this)">
	</div>
	<div class="result-info">
	<h3 style="margin-bottom: 10px; font-size: 17px; color: #0056b3;">例題 ${idx + 1} 解答</h3>
	<div class="result-row">
	<div class="result-label">駒関係</div>
	<div class="result-val"><strong>${q.komadoku}</strong></div>
	</div>
	<div class="result-row">
	<div class="result-label">指し手・手番</div>
	<div class="result-val"><strong>${q.sashite || "なし"}</strong></div>
	</div>
	<div class="result-row">
	<div class="result-label">あなた</div>
	<div class="result-val"><strong>${userAns}</strong></div>
	</div>
	<div class="result-row">
	<div class="result-label">水匠５ (AI)</div>
	<div class="result-val"><strong>${q.aiJudgment}</strong></div>
	</div>
	<div style="margin-top: 8px; font-size: 13px; color: #555;">最善手〜5番手評価値：</div>
	<div class="ai-moves-table">
	${movesHtml || '<span style="color:#888; font-size:12px;">データなし</span>'}
	</div>
	</div>
	`;
	container.appendChild(card);
	});
	}

	function startMainExperiment() {
	if (!questions || questions.length === 0) {
	alert("CSVデータの読み込み中です。少々お待ちください。");
	return;
	}
	currentIndex = 0;
	goToSection('experiment-section');
	showExperimentQuestion();
	}

	function showExperimentQuestion() {
	if (currentIndex >= questions.length) {
	goToSection('complete-section');
	return;
	}

	const q = questions[currentIndex];
	document.getElementById("question-number").innerText = `本番 第 ${currentIndex + 1} / ${questions.length} 問`;

	setupBoardOrientation(q.no, document.getElementById("exp-board-wrapper"), document.getElementById("exp-sente"), document.getElementById("exp-gote"));

	const imgElem = document.getElementById("exp-board-image");
	imgElem.src = q.image;

	document.getElementById("exp-komadoku").innerText = "【駒関係】 " + q.komadoku;
	document.getElementById("exp-sashite").innerText = "【指し手・手番】 " + (q.sashite || "なし");

	document.querySelectorAll('input[name="exp-ans"]').forEach(radio => radio.checked = false);
	document.getElementById("exp-next-btn").disabled = true;

	questionStartTime = performance.now();
	q.startISO = new Date().toLocaleString();
	}

	function nextExperiment() {
	const selectedRadio = document.querySelector('input[name="exp-ans"]:checked');
	if (!selectedRadio) return;

	const endTime = performance.now();
	const responseTimeMs = Math.round(endTime - questionStartTime);

	results.push({
	questionNo: questions[currentIndex].displayNo,
	answer: selectedRadio.value,
	startTime: questions[currentIndex].startISO,
	responseTime: responseTimeMs
	});

	currentIndex++;
	showExperimentQuestion();
	}

	function sendDataToSpreadsheet() {
	const btn = document.getElementById("send-data-btn");
	btn.disabled = true;
	btn.innerText = "送信中...";

	const payload = {
	subjectId: subjectId,
	appRanks: appRanksData,
	thresholds: thresholdData,
	answers: results
	};

	const GAS_URL = "https://script.google.com/macros/s/AKfycbwqi3LErIKQ6IFiCel02mkGNw-eGKRTAJ5KEhdIbJNuUkfbxtByHGLp8Dta94WbgH6mJQ/exec";

	fetch(GAS_URL, {
	method: "POST",
	mode: "no-cors",
	headers: {
	"Content-Type": "application/json"
	},
	body: JSON.stringify(payload)
	})
	.then(() => {
	alert("すべての行程が完了し、スプレッドシートへのデータ送信が完了しました！");
	showExperimentResults();
	})
	.catch((error) => {
	console.error("Error:", error);
	alert("すべての行程が完了し、スプレッドシートへのデータ送信が完了しました！");
	showExperimentResults();
	});
	}

	function showExperimentResults() {
	goToSection('experiment-result-section');

	const col1 = document.getElementById("summary-col-1");
	const col2 = document.getElementById("summary-col-2");
	const col3 = document.getElementById("summary-col-3");
	col1.innerHTML = ""; col2.innerHTML = ""; col3.innerHTML = "";

	questions.forEach((q, idx) => {
	const userAns = results[idx] ? results[idx].answer : "未回答";
	const tr = document.createElement("tr");
	tr.innerHTML = `
	<td style="font-weight: bold;">${q.displayNo}</td>
	<td><strong>${userAns}</strong></td>
	`;

	if (idx < 10) {
	col1.appendChild(tr);
	} else if (idx < 20) {
	col2.appendChild(tr);
	} else {
	col3.appendChild(tr);
	}
	});

	const container = document.getElementById("experiment-feedback-container");
	container.innerHTML = "";

	questions.forEach((q, idx) => {
	const userAns = results[idx] ? results[idx].answer : "未回答";

	let movesHtml = "";
	q.aiMoves.forEach((m, mIdx) => {
	let evalDisp = m.eval !== "" ? `(${m.eval})` : "";
	movesHtml += `
	<div class="ai-move-item">
	<span><strong>${mIdx + 1}.</strong> ${m.move}</span>
	<span style="color: #666;">${evalDisp}</span>
	</div>
	`;
	});

	let isInverse = q.no && q.no.includes("逆");
	let cardSenteText = isInverse ? "△ 後手" : "▲ 先手";
	let cardGoteText = isInverse ? "▲ 先手" : "△ 後手";

	const card = document.createElement("div");
	card.className = "result-card";
	card.innerHTML = `
	<div class="result-img-box" onclick="openModal('${q.image}')">
	<div style="font-size:11px; font-weight:bold; color:#555; margin-bottom:2px;">${cardSenteText}</div>
	<img src="${q.image}" alt="本番局面図" onerror="handleImageError(this)">
	<div style="font-size:11px; font-weight:bold; color:#555; margin-top:2px;">${cardGoteText}</div>
	<div style="font-size:11px; color:#007bff; margin-top:4px; font-weight:bold;">${q.displayNo} (タップで拡大)</div>
	</div>
	<div class="result-info">
	<h3 style="margin-bottom: 10px; font-size: 17px; color: #0056b3;">${q.displayNo} 解答</h3>
	<div class="result-row">
	<div class="result-label">駒関係</div>
	<div class="result-val"><strong>${q.komadoku}</strong></div>
	</div>
	<div class="result-row">
	<div class="result-label">指し手・手番</div>
	<div class="result-val"><strong>${q.sashite || "なし"}</strong></div>
	</div>
	<div class="result-row">
	<div class="result-label">あなた</div>
	<div class="result-val"><strong>${userAns}</strong></div>
	</div>
	<div class="result-row">
	<div class="result-label">水匠５ (AI)</div>
	<div class="result-val"><strong>${q.aiJudgment}</strong></div>
	</div>
	<div style="margin-top: 8px; font-size: 13px; color: #555;">最善手〜5番手評価値：</div>
	<div class="ai-moves-table">
	${movesHtml || '<span style="color:#888; font-size:12px;">データなし</span>'}
	</div>
	</div>
	`;
	container.appendChild(card);
	});
	}

	function openModal(imgSrc) {
	const modal = document.getElementById("image-modal");
	const modalImg = document.getElementById("modal-img");
	modal.style.display = "flex";
	modalImg.src = imgSrc;
	}

	function closeModal() {
	document.getElementById("image-modal").style.display = "none";
	}
</script>
